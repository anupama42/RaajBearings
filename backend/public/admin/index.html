<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database admin · Ball & Bearing Hub</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="admin-locked">
  <header>
    <div>
      <h1>Database admin</h1>
      <p>SQLite file: <code>backend/data/bearings.db</code></p>
    </div>
    <div class="header-actions">
      <a href="http://localhost:4200" target="_blank">Open catalog</a>
      <button id="admin-logout" class="ghost hidden">Log out</button>
    </div>
  </header>

  <nav>
    <button data-tab="products" class="active">Add / edit products</button>
    <button data-tab="browse">Browse tables</button>
    <button data-tab="sql">Run SQL</button>
    <button data-tab="filters">Filter options</button>
  </nav>

  <section id="products" class="tab active">
    <div class="grid">
      <form id="product-form">
        <h2>Product</h2>
        <input type="hidden" name="id" />
        <label>SKU <input name="sku" required /></label>
        <label>Name <input name="name" required /></label>
        <label>Brand <input name="brand" required /></label>
        <label>Type <input name="type" required /></label>
        <label>Description <textarea name="description" required></textarea></label>
        <label>Price min <input name="priceMin" type="number" step="0.01" required /></label>
        <label>Price max <input name="priceMax" type="number" step="0.01" required /></label>
        <label>MOQ <input name="moq" type="number" required /></label>
        <label>Material <input name="material" required /></label>
        <label>Inner diameter <input name="innerDiameter" required /></label>
        <label>Outer diameter <input name="outerDiameter" required /></label>
        <label>Image URL <input name="imageUrl" value="/images/bearing-1.svg" required /></label>
        <label>Filter A <input name="filterA" required /></label>
        <label>Filter B <input name="filterB" required /></label>
        <label>Filter C <input name="filterC" required /></label>
        <label>Filter D <input name="filterD" required /></label>
        <div class="actions">
          <button type="submit">Save to database</button>
          <button type="button" id="reset-form" class="ghost">New product</button>
        </div>
        <p id="product-status" class="status"></p>
      </form>
      <div>
        <h2>Products in database</h2>
        <div id="product-list"></div>
      </div>
    </div>
  </section>

  <section id="browse" class="tab">
    <div id="table-buttons"></div>
    <div id="table-view"></div>
  </section>

  <section id="sql" class="tab">
    <label>SQL
      <textarea id="sql-input" rows="8">SELECT * FROM products;</textarea>
    </label>
    <button id="run-sql">Execute</button>
    <pre id="sql-output"></pre>
  </section>

  <section id="filters" class="tab">
    <form id="filter-form">
      <label>Category
        <select name="category">
          <option>A</option>
          <option>B</option>
          <option>C</option>
          <option>D</option>
        </select>
      </label>
      <label>Value <input name="value" required /></label>
      <button type="submit">Add filter option</button>
    </form>
    <div id="filter-list"></div>
  </section>

  <div id="admin-login-overlay" class="login-overlay visible">
    <form id="admin-login-form" class="login-card">
      <h2>Admin login</h2>
      <p>Sign in to manage the database.</p>
      <label>Username <input name="username" autocomplete="username" required /></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit">Log in</button>
      <p id="admin-login-error" class="status error"></p>
    </form>
  </div>

  <script src="./app.js"></script>
</body>
</html>
