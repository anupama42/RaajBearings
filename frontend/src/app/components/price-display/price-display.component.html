<div class="price-block">
  <div class="sale-row">
    <span class="sale">{{ formatInr(product.salePrice) }}</span>
    @if (product.discountPercent > 0) {
      <span class="off">{{ product.discountPercent }}% off</span>
    }
  </div>
  @if (product.discountPercent > 0) {
    <p class="mrp">M.R.P.: <s>{{ formatInr(product.originalPrice) }}</s></p>
  }
  <p class="rating">{{ starLabel(product.rating) }}</p>
</div>
